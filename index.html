<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amazon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="navbar">
        <div class="nav-logo border">
            <div class="logo">
            </div>
        </div>
        <div class="nav-address border">
            <p class="first-address">deliver to</p>
            <div class="address">
                <i class="fa-solid fa-location-dot"></i>
                <p class="second-address">India</p>
            </div>
        </div>
        <div class="nav-search border">
            <select class="search-select">
                <option value="all">All</option>
                <option value="india">India</option>
                <option value="nepal">Nepal</option>
                <option value="srilanka">Srilanka</option>
                <option value="america">America</option>
                <option value="spain">Spain</option>
                <option value="bhutan">Bhutan</option>
                <option value="brazil">Brazil</option>
                <option value="canada">Canada</option>
                <option value="poland">Poland</option>
                <option value="norway">Norway</option>
            </select>
            <input placeholder="Search Amazon" class="search-input">
            <div class="searchbutton">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>
        <div class="nav-signin border">
            <p><span>Hello,signin</span></p>
            <p class="nav-second">Account & Lists</p>
        </div>
        <div class="nav-return border">
            <p><span>Returns</span></p>
            <p class="nav-second">& Orders</p>
        </div>
        <div class="nav-cart border">
            <i class="fa-solid fa-cart-shopping"></i>
            Cart    
        </div>
    </div>
    <div class="panel">
        <div class="panel-all border">
            <i class="fa-solid fa-bars"></i>
            All
        </div>
        <div class="panel-ops ">
            <p class="border"><a href="#">Today's Deals</a></p>
            <p class="border"><a href="#">Prime Video</a></p>
            <p class="border"><a href="#">Registry</a></p>
            <p class="border"><a href="#">Gift Cards</a></p>
            <p class="border"><a href="#">Customer Service</a></p>
            <p class="border"><a href="#">Sell</a></p>
        </div>
    </div>
</header>
</body>
</html>
